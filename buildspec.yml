version: 0.2

phases:
  install:
    runtime-versions:
      nodejs: 18
    commands:
      - echo "=== Installing dependencies ==="
      - npm ci

  pre_build:
    commands:
      - echo "=== Running linter ==="
      - npm run lint

  build:
    commands:
      - echo "=== Building application ==="
      - npm run build

  post_build:
    commands:
      - echo "=== Running smoke tests ==="
      - node smoke-test.js
      - echo "Build completed on $(date)"

artifacts:
  base-directory: build
  files:
    - '**/*'

cache:
  paths:
    - 'node_modules/**/*'
